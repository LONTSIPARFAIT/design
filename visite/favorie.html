<!DOCTYPE html>

  <title>Mes Favoris - Home Cameroun</title>
  <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gradient-to-b from-gray-50 to-gray-100 min-h-screen font-sans antialiased">

  <!-- Header fixe premium -->
  <header class="fixed top-0 left-0 right-0 z-30 bg-white/80 backdrop-blur-xl border-b border-gray-100/50 shadow-sm">
    <div class="max-w-screen-xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <button class="p-2 rounded-full hover:bg-gray-100 transition">
            <i class="fa-solid fa-chevron-left text-gray-700 text-lg"></i>
          </button>
          <h1 class="text-xl font-semibold text-gray-900">Favoris</h1>
        </div>
        <span class="text-sm font-medium text-gray-600">4 sauvegardés</span>
      </div>
    </div>
  </header>

  <main class="pt-20 pb-28 px-4 sm:px-6 max-w-screen-md mx-auto">

    <!-- État vide (optionnel - décommente si besoin) -->

        <i class="fa-regular fa-heart text-4xl text-red-300"></i>
      </div>
      <h2 class="text-2xl font-semibold text-gray-800 mb-3">Rien ici pour l'instant…</h2>

        Explorer les annonces
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

    <!-- Cartes favoris - style moderne 2026 -->
    <div class="space-y-6">

      <!-- Carte 1 -->
      <div class="group bg-white rounded-3xl overflow-hidden shadow-lg shadow-gray-200/40 hover:shadow-xl hover:shadow-gray-300/50 transition-all duration-300">
        <div class="relative h-64">
          <img 
            src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" 
            alt="Villa moderne Douala"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
          />
          
          <!-- Gradient overlay subtil -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>

          <!-- Badges premium -->
          <div class="absolute top-4 left-4 flex gap-2">
            <span class="px-3 py-1.5 bg-gradient-to-r from-green-600 to-emerald-600 text-white text-xs font-medium rounded-full shadow-sm">
              Location
            </span>
            <span class="px-3 py-1.5 bg-amber-500/90 text-white text-xs font-medium rounded-full backdrop-blur-sm">
              Nouveau
            </span>
          </div>

          <!-- Bouton cœur premium -->
          <button class="absolute top-4 right-4 w-10 h-10 bg-white/30 backdrop-blur-lg rounded-full flex items-center justify-center shadow-lg border border-white/40 hover:bg-white/50 transition-all">
            <i class="fa-solid fa-heart text-red-500 text-lg drop-shadow-md"></i>
          </button>
        </div>

        <div class="p-5">
          <h3 class="font-semibold text-lg text-gray-900 mb-1.5 line-clamp-2">
            Villa F5 luxe avec piscine - Bonapriso
          </h3>
          
          <div class="flex items-center gap-1.5 text-sm text-gray-600 mb-3">
            <i class="fa-solid fa-location-dot text-red-500"></i>
            Bonapriso, Douala
          </div>

          <div class="flex items-end justify-between">
            <div>
              <span class="text-2xl font-bold text-gray-900">950 000</span>
              <span class="text-sm text-gray-600 font-medium"> FCFA/mois</span>
            </div>
            <div class="flex gap-4 text-sm text-gray-700">
              <span class="flex items-center gap-1"><i class="fa-solid fa-bed text-xs"></i>5</span>
              <span class="flex items-center gap-1"><i class="fa-solid fa-bath text-xs"></i>4</span>
              <span class="flex items-center gap-1"><i class="fa-solid fa-ruler-combined text-xs"></i>420m²</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Duplique cette carte autant de fois que tu veux pour tester -->

    </div>
  </main>

  <!-- Navigation bottom bar premium -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/80 backdrop-blur-2xl border-t border-gray-100/50 shadow-2xl">

        </a>
        <a href="#" class="flex flex-col items-center text-red-600 relative">
          <i class="fa-solid fa-heart text-2xl"></i>

          <span class="text-xs mt-1">Favoris</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-500 hover:text-red-600 transition-colors">
          <i class="fa-solid fa-plus text-2xl"></i>
          <span class="text-xs mt-1">Publier</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-500 hover:text-red-600 transition-colors">
          <i class="fa-solid fa-user text-2xl"></i>
          <span class="text-xs mt-1">Profil</span>
        </a>
      </div>
    </div>
