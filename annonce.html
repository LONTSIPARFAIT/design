<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonces immobilières - Home Cameroun</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'orange': '#E54801',
                        'bordeaux': '#913327',
                        'violet': '#1B0B38',
                        'cream': '#FAF9F5',
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-cream">

    <!-- Header -->
    <header class="bg-violet text-white py-6 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-bold">Home Cameroun</h1>
            <div class="flex items-center gap-6">
                <a href="#" class="hover:underline">Accueil</a>
                <a href="#" class="hover:underline">Publier une annonce</a>
                <a href="#" class="hover:underline">Connexion</a>
            </div>
        </div>
    </header>

    <!-- Barre de recherche -->
    <section class="bg-white shadow-md py-6">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Rechercher par ville, quartier ou mot-clé..." class="w-full pl-12 pr-6 py-4 rounded-full border border-gray-300 focus:outline-none focus:border-orange text-gray-800">
                </div>
                <select id="sortSelect" class="px-6 py-4 rounded-full border border-gray-300 focus:outline-none focus:border-orange text-gray-800">
                    <option value="recent">Plus récentes</option>
                    <option value="prix-asc">Prix croissant</option>
                    <option value="prix-desc">Prix décroissant</option>
                    <option value="surface">Surface</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Contenu principal -->
    <section class="py-12 px-4">
        <div class="max-w-7xl mx-auto">

            <div class="grid lg:grid-cols-4 gap-8">
                <!-- Sidebar gauche : Filtres -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-2xl p-6 shadow-xl sticky top-24">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold text-violet">Filtrer par</h3>
                            <button id="clearFilters" class="text-orange hover:underline text-sm">Tout effacer</button>
                        </div>

                        <!-- Type de bien -->
                        <div class="mb-8">
                            <h4 class="font-semibold text-gray-800 mb-4">Type de bien</h4>
                            <div class="space-y-3">
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" class="filter-checkbox" data-filter="type" value="appartement">
                                    <span class="text-gray-700">Appartement (55)</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" class="filter-checkbox" data-filter="type" value="studio">
                                    <span class="text-gray-700">Studio (40)</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" class="filter-checkbox" data-filter="type" value="chambre">
                                    <span class="text-gray-700">Chambre (35)</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" class="filter-checkbox" data-filter="type" value="villa">
                                    <span class="text-gray-700">Villa (15)</span>
                                </label>
                            </div>
                        </div>

                        <!-- Ville -->
                        <div class="mb-8">
                            <h4 class="font-semibold text-gray-800 mb-4">Ville</h4>
                            <select id="cityFilter" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:border-orange text-gray-700">
                                <option value="">Toutes les villes</option>
                                <option value="douala">Douala</option>
                                <option value="yaounde">Yaoundé</option>
                                <option value="limbe">Limbe</option>
                                <option value="buea">Buea</option>
                                <option value="bamenda">Bamenda</option>
                            </select>
                        </div>

                        <!-- NOUVEAU : Nombre de pièces, chambres, douches, cuisine -->
                        <div class="mb-8">
                            <h4 class="font-semibold text-gray-800 mb-4">Configuration</h4>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">Pièces</label>
                                    <select id="piecesFilter" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-orange text-gray-700">
                                        <option value="">Toutes</option>
                                        <option value="1">1 pièce</option>
                                        <option value="2">2 pièces</option>
                                        <option value="3">3 pièces</option>
                                        <option value="4">4 pièces</option>
                                        <option value="5">5 pièces</option>
                                        <option value="6">6+ pièces</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">Chambres</label>
                                    <select id="chambresFilter" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-orange text-gray-700">
                                        <option value="">Toutes</option>
                                        <option value="1">1 chambre</option>
                                        <option value="2">2 chambres</option>
                                        <option value="3">3 chambres</option>
                                        <option value="4">4 chambres</option>
                                        <option value="5">5+ chambres</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">Douches/Sdb</label>
                                    <select id="douchesFilter" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-orange text-gray-700">
                                        <option value="">Toutes</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4+</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600 mb-1">Cuisines</label>
                                    <select id="cuisinesFilter" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:border-orange text-gray-700">
                                        <option value="">Toutes</option>
                                        <option value="1">1 cuisine</option>
                                        <option value="2">2 cuisines</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Prix par mois -->
                        <div class="mb-8">
                            <h4 class="font-semibold text-gray-800 mb-4">Prix par mois</h4>
                            <input type="range" id="priceRange" min="0" max="3000000" value="3000000" class="w-full">
                            <div class="flex justify-between text-sm text-gray-600 mt-2">
                                <span id="priceMin">0 F</span>
                                <span id="priceMax">3 000 000 F</span>
                            </div>
                        </div>

                        <!-- Surface -->
                        <div class="mb-8">
                            <h4 class="font-semibold text-gray-800 mb-4">Surface (m²)</h4>
                            <input type="range" id="surfaceRange" min="20" max="500" value="500" class="w-full">
                            <div class="flex justify-between text-sm text-gray-600 mt-2">
                                <span>20 m²</span>
                                <span>500 m²</span>
                            </div>
                        </div>

                        <!-- Commodités -->
                        <div class="mb-8">
                            <h4 class="font-semibold text-gray-800 mb-4">Commodités</h4>
                            <div class="space-y-3">
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" class="filter-checkbox" data-filter="amenity" value="securite">
                                    <span class="text-gray-700">Sécurité 24/7</span>
                                </label>
                                <label class="flex items-center gap-3 cursor-pointer">
                                    <input type="checkbox" class="filter-checkbox" data-filter="amenity" value="climatisation">
                                    <span class="text-gray-700">Climatisation</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contenu droit : annonces -->
                <div class="lg:col-span-3">
                    <div class="mb-8 flex justify-between items-center">
                        <h2 class="text-3xl font-bold text-violet" id="resultsCount">145 annonces trouvées</h2>
                    </div>

                    <div class="space-y-8" id="annoncesList">

                        <!-- Exemple d’annonces avec nouveaux data-attributes -->
                        <!-- Annonce 1 : Appartement F2 → 2 pièces, 1 chambre, 1 douche, 1 cuisine -->
                        <div class="annonce bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col md:flex-row hover:shadow-xl transition"
                            data-type="appartement" data-ville="douala" data-prix="600000" data-surface="90" data-amenities="securite"
                            data-pieces="2" data-chambres="1" data-douches="1" data-cuisines="1">
                            <!-- ... contenu identique ... -->
                        </div>

                        <!-- Annonce 2 : Studio → 1 pièce, 0 chambre (studio), 1 douche, 1 cuisine -->
                        <div class="annonce ..." data-type="studio" ... data-pieces="1" data-chambres="0" data-douches="1" data-cuisines="1">
                            <!-- ... -->
                        </div>

                        <!-- Annonce 3 : Chambre seule → 1 pièce, 1 chambre, 1 douche (souvent partagée, mais on met 1), 0 cuisine -->
                        <div class="annonce ..." data-type="chambre" ... data-pieces="1" data-chambres="1" data-douches="1" data-cuisines="0">
                            <!-- ... -->
                        </div>

                        <!-- Annonce 4 : Villa → estimation 6+ pièces, 4 chambres, 3 douches, 1 cuisine -->
                        <div class="annonce ..." data-type="villa" ... data-pieces="6" data-chambres="4" data-douches="3" data-cuisines="1">
                            <!-- ... -->
                        </div>

                        <!-- Vous devez ajouter ces attributs à toutes les autres annonces de la même façon -->

                        <!-- Les autres annonces conservent leur contenu d’origine, mais ajoutent les data-... -->
                        <!-- Pour gagner de la place ici, je ne recopie pas tout, mais le principe est le même -->

                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-violet text-white py-10 mt-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-lg">&copy; 2025 Home Cameroun - Tous droits réservés</p>
        </div>
    </footer>

</body>
</html>
